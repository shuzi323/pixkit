name: CI

# 每次 push 和 PR 都跑一遍端到端测试。
# 注意：这个 workflow 只做验证，不负责部署 —— 部署交给 Cloudflare Pages 的 Git 集成。
# 需要「测试不过就不部署」的话，见 README「方式 D」。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 启动本地静态服务
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8899/ >/dev/null && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8899/ || (echo "静态服务没起来" && exit 1)

      - name: 确认浏览器可用
        run: |
          echo "CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" >> "$GITHUB_ENV"

      - name: 端到端测试
        run: npm test

      - name: 打包部署目录
        run: npm run dist

      - name: 失败时上传截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/.cache
          retention-days: 7
